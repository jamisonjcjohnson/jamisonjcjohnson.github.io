  # skill icons are on avatar's left and right side. Reference urls are http://fontawesome.io/ and http://fizzed.com/oss/font-mfizz
  skill_icon1:
    - name: fa-paper-plane-o
    - name: fa-linux
  skill_icon2:
    - name: fa-apple
    - name: fa-code
  desc: "With over 15 years of experience in systems administration, infrastructure engineering, and government IT support, I specialize in building, securing, maintaining, and troubleshooting enterprise technology environments. My experience spans Linux and Windows administration, system hardening, network security, virtualization, automation, containerized applications, vulnerability management, identity services, and enterprise infrastructure.

<br><br>I have extensive hands-on experience administering Linux environments including RHEL, CentOS, and Ubuntu, as well as Windows desktop and server platforms. My work also includes VMware vSphere and Proxmox virtualization, Docker-based applications, Active Directory and LDAP, enterprise networking, storage and backup systems, and security practices aligned with DoD standards.

<br><br>Beyond my primary professional role, I provide IT consulting and project-based support to individuals and small businesses through Johnson Premier Consulting. I assist clients with technology planning, infrastructure improvements, network and system configuration, troubleshooting, security, documentation, and other technical needs.

<br><br>I also enjoy building and maintaining technology outside of the traditional enterprise environment. Through home lab projects, automation, self-hosted applications, technical documentation, and this website, I continue to expand my knowledge while sharing practical solutions and lessons learned from real-world IT challenges.

<br><br>This site serves as a collection of my professional experience, technical projects, documentation, and ongoing journey in information technology."


